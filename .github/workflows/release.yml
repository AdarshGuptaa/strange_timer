name: Release

# Cut a release by pushing a tag matching v*:
#   git tag v1.0.0-beta.3 && git push origin v1.0.0-beta.3
# The workflow tests, builds, packages, verifies and uploads archives and
# installers for every platform to the GitHub release for that tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # rodio needs ALSA headers; reqwest needs OpenSSL. Without these
      # the alsa-sys build script fails with "Package alsa was not found".
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libssl-dev

      # Headless runners have no sound card: ALSA errors would spew into
      # the daemon log (interleaving with the lines tests assert on) and
      # audio buzzers would fail. A null default PCM lets the daemon
      # "play" audio silently, like a real desktop.
      - name: Configure a null ALSA device
        run: |
          cat > "$HOME/.asoundrc" <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build debug binaries for e2e tests
        run: cargo build --workspace --locked

      # e2e tests mutate process-global environment variables (the
      # STRANGETIMER_TEST_* / XDG_SESSION_TYPE seams), so they must not run
      # in parallel within the test binary.
      - name: Run tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  man-page:
    name: Generate CLI man page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libssl-dev help2man

      - name: Build debug CLI
        run: cargo build -p strangetimer --locked

      # The .1 file is plain troff and platform-independent, so the same
      # page ships in every archive (Linux, macOS, Windows). The daemon
      # has no --help mode, so no page is generated for it.
      - name: Generate man page
        run: |
          mkdir -p man
          help2man -N -n "StrangeTimer CLI" ./target/debug/strangetimer > man/strangetimer.1
          test -s man/strangetimer.1

      - name: Upload man page
        uses: actions/upload-artifact@v4
        with:
          name: man-page
          # Note: upload-artifact flattens the page to the artifact root
          # (strangetimer.1); the build job re-roots it into dist/man/.
          path: man
          if-no-files-found: error

  build:
    name: Package ${{ matrix.label }}
    needs: [test, man-page]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - label: macos-aarch64
            os: macos-14
            archive: tar.gz
          - label: windows-x86_64
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libssl-dev

      - name: Download CLI man page
        uses: actions/download-artifact@v4
        with:
          name: man-page
          path: man-page

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      # Platform-aware executable suffix (empty on unix, ".exe" on Windows).
      - name: Assemble archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE=.exe
            ZIP=true
          else
            EXE=
            ZIP=false
          fi
          ARCHIVE_NAME="strangetimer-${{ env.VERSION }}-${{ matrix.label }}.${{ matrix.archive }}"
          mkdir -p dist/completions dist/man
          # The man-page artifact arrives flattened at man-page/strangetimer.1;
          # re-root it into dist/man/ so every archive ships man/strangetimer.1.
          cp man-page/strangetimer.1 dist/man/
          cp ./target/release/strangetimer$EXE dist/
          cp ./target/release/strangetimer-daemon$EXE dist/
          cp -r ./crates/strangetimer-daemon/assets dist/
          cp ./LICENSE dist/
          cp ./README.md dist/

          # Shell completions from the real binary (PATH-resolved scripts).
          ./target/release/strangetimer$EXE completions bash > dist/completions/strangetimer.bash
          ./target/release/strangetimer$EXE completions zsh  > dist/completions/_strangetimer
          ./target/release/strangetimer$EXE completions fish > dist/completions/strangetimer.fish
          ./target/release/strangetimer$EXE completions powershell > dist/completions/_strangetimer.ps1

          # Man page generated once in the man-page job and downloaded
          # above — included in every platform's archive (plain troff,
          # platform-independent; the daemon has no page).
          if [ "$ZIP" = "true" ]; then
            (cd dist && 7z a -tzip "../$ARCHIVE_NAME" *)
          else
            tar -C dist -czf "$ARCHIVE_NAME" .
          fi

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Generate per-platform manifest
        shell: bash
        run: |
          {
            echo "version=${{ env.VERSION }}"
            echo "platform=${{ matrix.label }}"
            echo "archive=$ARCHIVE_NAME"
            echo "sha256=$(sha256sum "$ARCHIVE_NAME" | cut -d' ' -f1)"
          } > manifest-${{ matrix.label }}.txt
          cat manifest-${{ matrix.label }}.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.label }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            manifest-${{ matrix.label }}.txt
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate global checksums and verify artifacts
        shell: bash
        run: |
          cd release-assets
          ls -la
          for f in strangetimer-${{ env.VERSION }}-*; do
            test -s "$f" || { echo "empty artifact: $f" >&2; exit 1; }
          done
          sha256sum strangetimer-${{ env.VERSION }}-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          # Pre-release tags (e.g. v1.0.0-beta.1) are marked prerelease;
          # stable tags are NOT, so they are picked up by the installers'
          # releases/latest resolution. Prerelease tags are never "latest",
          # so installers must pass --version / -Version explicitly for them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
            scripts/install.sh
            scripts/install.ps1
          fail_on_unmatched_files: true

  smoke-test:
    name: Smoke test (linux-x86_64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the packaged linux archive
        uses: actions/download-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: smoke

      - name: Extract and verify the archive
        run: |
          ARCHIVE="smoke/strangetimer-${{ env.VERSION }}-linux-x86_64.tar.gz"
          test -s "$ARCHIVE" || { echo "missing archive: $ARCHIVE" >&2; exit 1; }
          mkdir -p smoke/x
          tar -xzf "$ARCHIVE" -C smoke/x
          cd smoke/x
          ./strangetimer --version | grep -Fq "${VERSION#v}"
          test -x ./strangetimer-daemon || { echo "daemon binary missing" >&2; exit 1; }
          test -f ./assets/default.mp4 || { echo "assets/default.mp4 missing" >&2; exit 1; }
          test -f ./assets/chime.wav || { echo "assets/chime.wav missing" >&2; exit 1; }
          test -s ./man/strangetimer.1 || { echo "man/strangetimer.1 missing or empty" >&2; exit 1; }
          ./strangetimer completions bash | grep -q COMPLETE=
          ./strangetimer completions fish | grep -q "strangetimer"
          ./strangetimer install-completions --shell bash
          export STRANGETIMER_DATA_DIR="$PWD/data" STRANGETIMER_SOCKET="$PWD/st.sock"
          mkdir -p "$STRANGETIMER_DATA_DIR"
          printf '{"runs":[],"registered":true,"last_saved_at":null}' > "$STRANGETIMER_DATA_DIR/state.json"
          ./strangetimer daemon start
          ./strangetimer create timer smoke 5m --no-preview
          ./strangetimer view timers --snapshot | grep -q "INACTIVE TIMERS"
          ./strangetimer doctor | grep -q "Daemon: running"
          ./strangetimer daemon stop

  release-check:
    name: Release artifacts check
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify release assets exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.VERSION }}" --json assets -q '.assets[].name' > assets.txt
          cat assets.txt
          for expected in \
            "strangetimer-${{ env.VERSION }}-linux-x86_64.tar.gz" \
            "strangetimer-${{ env.VERSION }}-macos-aarch64.tar.gz" \
            "strangetimer-${{ env.VERSION }}-windows-x86_64.zip" \
            "checksums.txt" \
            "install.sh" \
            "install.ps1"; do
            grep -qx "$expected" assets.txt || { echo "missing asset: $expected" >&2; exit 1; }
          done
          echo "All release assets present."
